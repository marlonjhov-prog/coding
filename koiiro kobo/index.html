<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación - Until I Found You</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            position: relative;
            color: white;
            overflow: hidden;
        }

        /* Fondo de alta resolución con tono romántico */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            filter: blur(2px);
            z-index: -2;
            transform: scale(1.05);
        }

        /* Capa oscura para garantizar legibilidad */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.7) 100%);
            z-index: -1;
        }

        .lyrics-container {
            text-align: center;
            white-space: pre-wrap;
            padding: 30px;
            font-size: 1.5rem;
            font-weight: 600;
            max-width: 800px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
            z-index: 1;
        }

        .line {
            display: block;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="lyrics-container" id="lyricsContainer"></div>

    <script>
        const lyrics = [
            "Nunca te volveré a soltar como lo hice antes,",
            "solía decir que nunca me enamoraría...",
            "hasta que te encontré.",
            "Dije que nunca caería en el amor,",
            "a menos que fuera para caer en ti.",
            "Y nunca te dejaré ir."
        ];

        const delays = [0.6, 1.2, 0.8, 1.0, 0.8, 0.8];
        const speeds = [0.07, 0.07, 0.08, 0.07, 0.07, 0.08];

        function animateText(text, container, speed) {
            return new Promise((resolve) => {
                let i = 0;
                function typeChar() {
                    if (i < text.length) {
                        container.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(typeChar, speed * 1000);
                    } else {
                        resolve();
                    }
                }
                typeChar();
            });
        }

        async function singSong() {
            const lyricsContainer = document.getElementById('lyricsContainer');
            for (let i = 0; i < lyrics.length; i++) {
                await new Promise(resolve => setTimeout(resolve, delays[i] * 1000));
                const lineContainer = document.createElement('span');
                lineContainer.classList.add('line');
                lyricsContainer.appendChild(lineContainer);
                await animateText(lyrics[i], lineContainer, speeds[i]);
            }
        }

        singSong();
    </script>
</body>
</html>
