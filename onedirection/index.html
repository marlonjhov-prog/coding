<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18 - One Direction</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #lyrics-container {
            width: 100%;
            max-width: 600px;
            text-align: left;
            line-height: 1.8;
            font-size: 1.2rem;
            margin-top: 20px;
        }
        .line {
            min-height: 1.8em;
            margin-bottom: 8px;
            word-wrap: break-word;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: #58a6ff;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <button id="play-btn">▶ Reproducir Canción</button>
    <audio id="audio-player" src="18.mp3"></audio>
    <div id="lyrics-container"></div>

    <script src="script.js"></script>
</body>
</html>
